title = "Ghostship secret detection"

[extend]
useDefault = true

[[rules]]
id = "nostr-nsec"
description = "Nostr secret key"
regex = '''(?i)\bnsec1[023456789acdefghjklmnpqrstuvwxyz]{58}\b'''

[[rules]]
id = "nostr-npub"
description = "Nostr public identity associated with private infrastructure"
regex = '''(?i)\bnpub1[023456789acdefghjklmnpqrstuvwxyz]{58}\b'''

[[rules]]
id = "age-secret-key"
description = "age identity secret key"
regex = '''\bAGE-SECRET-KEY-1[0-9A-Z]{58}\b'''
keywords = ["AGE-SECRET-KEY-1"]

[[rules]]
id = "private-key-block"
description = "PEM or OpenSSH private key"
regex = '''-----BEGIN (?:OPENSSH |EC |RSA )?PRIVATE KEY-----'''
keywords = ["PRIVATE KEY"]

[[rules]]
id = "ghostship-sensitive-assignment"
description = "Sensitive infrastructure value assigned in a text file"
regex = '''(?im)(?:^|[^\w])["']?(?:password|passwd|secret|private[_-]?key|nsec|token|auth[_-]?token|access[_-]?token|refresh[_-]?token|session[_-]?token|bearer[_-]?token|api[_-]?(?:token|key)|client[_-]?secret|hmac[_-]?secret|credential)["']?\s*[:=]\s*((?:["'][^"'\n]+["']|[^\s"'#][^\n#]*))'''
secretGroup = 1

  [rules.allowlist]
  regexTarget = "secret"
  regexes = [
    '''(?i)^(?:["']?(?:null|none|unset)["']?|~)$''',
    '''^["']?\$[A-Za-z_][A-Za-z0-9_]*["']?$''',
    '''^["']?\$\{[A-Za-z_][A-Za-z0-9_]*\}["']?$''',
    '''^["']?\$\{\{[^}\n]+\}\}["']?$''',
  ]

[[rules]]
id = "nixos-boot-device"
description = "Host-specific NixOS boot device"
regex = '''(?s)boot\.loader\.grub\.devices?\s*=\s*(?:["']/dev/[^"'\n]+["']|\[[^\]]{0,1000}["']/dev/[^"'\n]+["'])'''
keywords = ["boot.loader.grub.device"]

[[rules]]
id = "host-block-device"
description = "Host-specific block-device path"
regex = '''/dev/(?:x?vd[a-z][0-9]*|sd[a-z][0-9]*|nvme[0-9]+n[0-9]+(?:p[0-9]+)?|mmcblk[0-9]+(?:p[0-9]+)?|md[0-9]+|dm-[0-9]+|mapper/[A-Za-z0-9._+-]+)\b'''
keywords = ["/dev/vd", "/dev/xvd", "/dev/sd", "/dev/nvme", "/dev/mmcblk", "/dev/md", "/dev/dm-", "/dev/mapper/"]

[[rules]]
id = "persistent-disk-id"
description = "Host-specific persistent disk identifier"
regex = '''/dev/disk/by-(?:id|label|path|uuid|partuuid)/[A-Za-z0-9._:+-]+'''
keywords = ["/dev/disk/by-id/", "/dev/disk/by-label/", "/dev/disk/by-path/", "/dev/disk/by-uuid/", "/dev/disk/by-partuuid/"]

[[rules]]
id = "raw-filesystem-uuid"
description = "Host-specific raw filesystem or partition UUID"
regex = '''(?i)\b(?:UUID|PARTUUID)=[0-9a-f][0-9a-f-]{7,}\b'''

[[rules]]
id = "structured-disk-uuid"
description = "Host-specific structured disk UUID assignment"
regex = '''(?i)["']?(?:(?:disk|filesystem|partition|fs)[_-]?(?:uuid|partuuid)|(?:uuid|partuuid)[_-]?(?:disk|filesystem|partition|fs))["']?\s*[:=]\s*["']?[0-9a-f][0-9a-f-]{7,}\b'''

[[rules]]
id = "nixos-generated-hardware-config"
description = "Generated host-specific NixOS hardware configuration"
regex = '''(?i)generated by[^\n]{0,40}nixos-generate-config'''

[[rules]]
id = "private-host-assignment"
description = "Private deployment or peer host inventory assignment"
regex = '''(?i)["']?(?:deployment\.targetHost|targetHost|(?:deployment|production|inventory|ssh)Host|peer(?:Host|Address|Identity)|fipsPeer|host(?:Address|IP))["']?\s*[:=]\s*(?:["'][^"'<>\n]+["']|[^\s"'#<>][^\n#]*)'''

[[rules]]
id = "recovery-material-assignment"
description = "Recovery mnemonic, seed, or passphrase assignment"
regex = '''(?i)["']?(?:recovery|mnemonic|seed[_-]?phrase|recovery[_-]?seed|passphrase)["']?\s*[:=]\s*(?:["'][^"'\n]+["']|[^\s"'#][^\n#]*)'''

[[rules]]
id = "bare-recovery-seed-phrase"
description = "Mnemonic-shaped value assigned to a bare seed field"
regex = '''(?i)["']?seed["']?\s*[:=]\s*["']?[a-z]+(?:\s+[a-z]+){11,23}["']?'''

[[rules]]
id = "sops-ciphertext"
description = "SOPS encrypted payload"
regex = '''ENC\[AES256_GCM,data:[^,\]\n]+'''

[[rules]]
id = "age-encrypted-payload"
description = "age encrypted payload"
regex = '''-----BEGIN[ ]AGE[ ]ENCRYPTED[ ]FILE-----'''

[[rules]]
id = "age-native-payload"
description = "age native encrypted payload"
regex = '''age-encryption\.org/v1'''

[[rules]]
id = "openpgp-encrypted-payload"
description = "OpenPGP encrypted payload"
regex = '''-----BEGIN[ ]PGP[ ]MESSAGE-----'''

[[rules]]
id = "ansible-vault-payload"
description = "Ansible Vault encrypted payload"
regex = '''\$ANSIBLE_VAULT;[0-9.]+;AES256'''
